name: Verify parent registration live readback

on:
  pull_request:
    paths:
      - 'scripts/verify_registration_live.py'
      - 'tests/test_verify_registration_live.py'
      - '.github/workflows/verify-registration-live.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_registration_live.py'
      - 'tests/test_verify_registration_live.py'
      - '.github/workflows/verify-registration-live.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Store reviewed pilot badges privately in R2]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verifier-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact build and hosting expectations
        run: python -m unittest discover -s tests -p 'test_verify_registration_live.py' -v
  # Served bytes can match a new revision only after its publisher succeeds.
  # Push/PR events still exercise verifier-tests without racing production.
  readback:
    needs: verifier-tests
    if: >-
      github.repository == 'michaeljbriggs86-ctrl/Grassroots-Club-Hub' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare served bytes and reject invalid unauthenticated requests
        run: python scripts/verify_registration_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-live-readback-${{ github.run_id }}
          path: registration-live-review
          retention-days: 14
