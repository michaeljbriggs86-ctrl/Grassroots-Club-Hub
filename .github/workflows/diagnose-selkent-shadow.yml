name: Diagnose private Selkent collector
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_selkent_shadow.py'
      - '.github/workflows/diagnose-selkent-shadow.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read collector schedule and safe error categories
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/diagnose_selkent_shadow.py
