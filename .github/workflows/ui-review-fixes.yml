name: UI review regression checks
on:
  pull_request:
    paths:
      - 'app/src/main/assets/**'
      - 'cloudflare/web-app/build.py'
      - 'tests/**'
      - '.github/workflows/ui-review-fixes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check client behavior and build
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/cloud.js
          node tests/test_ui_review_fixes.js
          node tests/test_web_parent_signin.js
          node tests/test_web_mobile_navigation.js
          node tests/test_coach_signup_flow.js
          node tests/test_tactics_drag.js
          node tests/test_tactics_fixture_plan.js
          node tests/test_tactics_fixture_identity.js
          node tests/test_two_capacities.js
          python cloudflare/web-app/build.py
          cmp app/src/main/assets/inter-variable.woff2 cloudflare/web-app/dist/inter-variable.woff2
          cmp app/src/main/assets/inter-OFL.txt cloudflare/web-app/dist/inter-OFL.txt
          git diff --check
