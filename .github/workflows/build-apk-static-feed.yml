          overlay_js = project / 'app/src/main/assets/static-feed-overlay.js'
          app_gradle = project / 'app/build.gradle'

          for required in (main_activity, index_html, app_gradle):
              if not required.exists():
                  raise SystemExit(f'Missing expected Android source file: {required}')

          existing_main = main_activity.read_text(encoding='utf-8')
