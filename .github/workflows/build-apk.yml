name: Android APK v2.2.9 PitchKind

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source contract
        run: |
          set -euo pipefail
          python verification/verify_v2_2_9_pitchkind_ui.py
          python -m unittest discover -s tests -p "test_*.py" -v
          node --check app/src/main/assets/cloud.js
          node --check app/src/main/assets/onboarding.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/static-feed-overlay.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK 35 ready."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK content gate
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/pitchkind-wt_logo-primary.svg'
          unzip -l "$APK" | grep -q 'assets/pitchkind-wt_mark.svg'
          unzip -p "$APK" assets/index.html | grep -q '<title>PitchKind</title>'
          unzip -p "$APK" assets/index.html | grep -q 'App version 2.2.9'
          ! unzip -p "$APK" assets/index.html | grep -q 'CONNECT • ORGANISE • GROW THE GAME'
          ! unzip -p "$APK" assets/index.html | grep -q 'More Than A Game'
          mkdir -p dist
          cp "$APK" dist/PitchKind-v2.2.9-debug.apk
          sha256sum dist/PitchKind-v2.2.9-debug.apk > dist/PitchKind-v2.2.9-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PitchKind-v2.2.9-debug
          path: |
            dist/PitchKind-v2.2.9-debug.apk
            dist/PitchKind-v2.2.9-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
