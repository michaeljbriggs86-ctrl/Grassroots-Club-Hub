          main_activity.write_bytes(base64.b64decode(''.join(main_b64.split())))
          overlay_js.write_bytes(base64.b64decode(''.join(overlay_b64.split())))

          index = index_html.read_text(encoding='utf-8')
          tag = '<script src="static-feed-overlay.js"></script>'
          if tag not in index:
              if '</body>' not in index:
                  raise SystemExit('index.html has no closing body tag')
              index = index.replace('</body>', f'  {tag}\n</body>', 1)
              index_html.write_text(index, encoding='utf-8')

          gradle = app_gradle.read_text(encoding='utf-8')
          if "versionCode 2201" not in gradle or "versionName '2.2.1'" not in gradle:
              raise SystemExit('Unexpected app/build.gradle version; static-feed patch not applied')
          gradle = gradle.replace('versionCode 2201', 'versionCode 2202', 1)
          gradle = gradle.replace("versionName '2.2.1'", "versionName '2.2.2'", 1)
          app_gradle.write_text(gradle, encoding='utf-8')

          output = Path(os.environ['GITHUB_WORKSPACE']) / 'Grassroots_Club_Hub_Android_Universal_v2_2_2_STATIC_FEED.zip'
          root_name = 'Grassroots_Club_Hub_Android_Universal_v2_2_2_STATIC_FEED'
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for file in sorted(project.rglob('*')):
                  if file.is_file():
                      zf.write(file, Path(root_name) / file.relative_to(project))

          print(f'Patched static-feed source created: {output}')
          PY_PATCH

      - name: Verify static-feed patch
        shell: bash
        run: |
          set -euo pipefail
          node --check "$PROJECT_DIR/app/src/main/assets/static-feed-overlay.js"
          grep -F "raw.githubusercontent.com" "$PROJECT_DIR/app/src/main/java/com/grassrootsclubhub/universal/MainActivity.java"
          grep -F "/michaeljbriggs86-ctrl/Grassroots-Club-Hub/main/data/directory.json" "$PROJECT_DIR/app/src/main/java/com/grassrootsclubhub/universal/MainActivity.java"
          grep -F "/michaeljbriggs86-ctrl/Grassroots-Club-Hub/main/data/results.json" "$PROJECT_DIR/app/src/main/java/com/grassrootsclubhub/universal/MainActivity.java"
          grep -F 'static-feed-overlay.js' "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -F 'versionCode 2202' "$PROJECT_DIR/app/build.gradle"
          grep -F "versionName '2.2.2'" "$PROJECT_DIR/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK 35 ready."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Universal APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi
          cp "$APK" Grassroots-Club-Hub-v2.2.2-static-feed.apk
          ls -lh Grassroots-Club-Hub-v2.2.2-static-feed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grassroots-Club-Hub-APK-v2.2.2-Static-Feed
          path: Grassroots-Club-Hub-v2.2.2-static-feed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload patched Android source
        uses: actions/upload-artifact@v4
        with:
          name: Grassroots-Club-Hub-Android-v2.2.2-Static-Feed-Source
          path: Grassroots_Club_Hub_Android_Universal_v2_2_2_STATIC_FEED.zip
          if-no-files-found: error
          retention-days: 30
