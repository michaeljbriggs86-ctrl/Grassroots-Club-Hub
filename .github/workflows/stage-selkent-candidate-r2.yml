name: Stage verified Selkent candidate privately in R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-selkent-candidate-r2.yml'

permissions:
  contents: read

concurrency:
  group: stage-selkent-candidate-r2
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: pitchkind-selkent-feed-stage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test candidate and independent verifier
        run: |
          python -m pip install requests beautifulsoup4
          node --test cloudflare/selkent-shadow/tests/candidate-feed.test.mjs \
            cloudflare/selkent-shadow/tests/verify-snapshot.test.mjs
          python -m unittest discover -s cloudflare/selkent-shadow/tests \
            -p 'test_compare_snapshot.py' -v
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Read private snapshot
        run: |
          npx --yes wrangler@4.142.0 r2 object get \
            pitchkind-selkent-shadow/shadow/latest.json \
            --remote --file "$RUNNER_TEMP/selkent-shadow-latest.json"
      - name: Verify and build private candidate
        run: |
          node cloudflare/selkent-shadow/verify-snapshot.mjs \
            "$RUNNER_TEMP/selkent-shadow-latest.json" data/results.json 420
          node cloudflare/selkent-shadow/build-candidate.mjs \
            "$RUNNER_TEMP/selkent-shadow-latest.json" data/results.json \
            "$RUNNER_TEMP/selkent-candidate.json"
          python cloudflare/selkent-shadow/compare_snapshot.py \
            "$RUNNER_TEMP/selkent-shadow-latest.json" data/results.json \
            "$RUNNER_TEMP/selkent-candidate.json"
      - name: Create private staging bucket if needed
        run: |
          if ! npx --yes wrangler@4.142.0 r2 bucket info "$BUCKET"; then
            npx --yes wrangler@4.142.0 r2 bucket create "$BUCKET"
          fi
      - name: Stage candidate and compare R2 readback
        run: |
          object_path="$BUCKET/staging/$GITHUB_SHA/results.json"
          npx --yes wrangler@4.142.0 r2 object put "$object_path" \
            --remote --file "$RUNNER_TEMP/selkent-candidate.json"
          npx --yes wrangler@4.142.0 r2 object get "$object_path" \
            --remote --file "$RUNNER_TEMP/selkent-candidate-readback.json"
          cmp "$RUNNER_TEMP/selkent-candidate.json" \
            "$RUNNER_TEMP/selkent-candidate-readback.json"
          sha256sum "$RUNNER_TEMP/selkent-candidate-readback.json"
          echo "Private R2 candidate staged and byte-verified for $GITHUB_SHA"
