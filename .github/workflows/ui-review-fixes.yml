name: UI review regression checks
on:
  # Check the combined main tree after merges.
  push:
    branches:
      - main
  # The guarded publisher commits with GITHUB_TOKEN, which cannot trigger push CI.
  # Check current main after it finishes, without consuming artifacts or secrets.
  workflow_run:
    workflows:
      - Store reviewed pilot badges privately in R2
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'app/src/main/assets/**'
      - 'cloudflare/web-app/build.py'
      - 'cloudflare/web-app/src/**'
      - 'cloudflare/web-app/tests/**'
      - 'tests/**'
      - 'web/db-drafts/019_member_contact*.sql'
      - 'web/db-drafts/admin_player_onboarding_candidate.sql'
      - 'web/db-drafts/registration_contact_conduct_candidate.sql'
      - 'web/db-drafts/test/*registration*'
      - 'cloudflare/web-app/src/registration-document.js'
      - 'web/db-drafts/test/*player-onboarding*'
      - 'supabase/migrations/*admin_player_onboarding.sql'
      - 'web/db-drafts/test/*contact*.sql'
      - 'web/db-drafts/test/run-member-contact-import.cjs'
      - 'verification/verify_v2_2_30_pitchkind_ui.py'
      - 'verification/browser/**'
      - '.github/workflows/ui-review-fixes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-regressions:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check client behavior and build
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/cloud.js
          node --check app/src/main/assets/player-onboarding.js
          node --check app/src/main/assets/coach-onboarding.js
          node --check app/src/main/assets/registration-conduct.js
          node --test cloudflare/web-app/tests/*.test.mjs
          python verification/verify_v2_2_30_pitchkind_ui.py
          python verification/verify_club_logo_quality.py
          for test in tests/test_*.js; do
            echo "Running $test"
            node "$test"
          done
          python cloudflare/web-app/build.py
          for asset in index.html app.js cloud.js styles.css app-design-system.css coach-qualifications.js member-contact-import.js person-profiles.js player-onboarding.js coach-onboarding.js; do
            cmp "app/src/main/assets/$asset" "cloudflare/web-app/dist/$asset"
          done
          cmp app/src/main/assets/inter-variable.woff2 cloudflare/web-app/dist/inter-variable.woff2
          cmp app/src/main/assets/inter-OFL.txt cloudflare/web-app/dist/inter-OFL.txt
          git diff --check
      - name: Check contact import in throwaway PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/member-contact-sql" --no-audit --no-fund @electric-sql/pglite@0.3.14
          node web/db-drafts/test/run-member-contact-import.cjs "$RUNNER_TEMP/member-contact-sql/node_modules/@electric-sql/pglite"
      - name: Render login, dialogs and statistics in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/visual-review" --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/visual-review/node_modules/.bin/playwright" install --with-deps chromium
          node verification/browser/verify_visual_rollout.cjs "$RUNNER_TEMP/visual-review/node_modules/playwright" "$RUNNER_TEMP/visual-review-output"
          node verification/browser/verify_hero_context.cjs "$RUNNER_TEMP/visual-review/node_modules/playwright" "$RUNNER_TEMP/visual-review-output/hero-context"
          node verification/browser/verify_cup_freshness.cjs "$RUNNER_TEMP/visual-review/node_modules/playwright" "$RUNNER_TEMP/visual-review-output/cup-freshness"
          node verification/browser/verify_club_details.cjs "$RUNNER_TEMP/visual-review/node_modules/playwright" "$RUNNER_TEMP/visual-review-output/club-details"
      - name: Preserve visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_id }}
          path: ${{ runner.temp }}/visual-review-output
          if-no-files-found: ignore
          retention-days: 7


      - name: Check coach qualification draft in throwaway PostgreSQL
        run: node web/db-drafts/test/run-coach-qualifications.cjs "$RUNNER_TEMP/member-contact-sql/node_modules/@electric-sql/pglite"

      - name: Check Admin onboarding with invented players
        run: node web/db-drafts/test/run-player-onboarding.cjs "$RUNNER_TEMP/member-contact-sql/node_modules/@electric-sql/pglite"

      - name: Check registration contact and conduct with invented data
        run: node web/db-drafts/test/run-registration-contact-conduct.cjs "$RUNNER_TEMP/member-contact-sql/node_modules/@electric-sql/pglite"
