name: Scrape Selkent Club/League Directory

on:
  schedule:
    # The directory (clubs, divisions, team lists) barely changes mid-season -
    # weekly is enough. Sunday night, after weekend fixtures/registrations
    # would have settled.
    - cron: '0 22 * * 0'   # once weekly, Sunday 22:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

jobs:
  scrape-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run directory scraper
        run: python scripts/scrape_directory.py

      - name: Commit updated data
        run: |
          git config user.name "selkent-sync-bot"
          git config user.email "actions@github.com"
          git add data/directory.json data/directory_scrape_diagnostics.json
          git diff --staged --quiet || git commit -m "Update Selkent club/league directory [automated]"
          git push
