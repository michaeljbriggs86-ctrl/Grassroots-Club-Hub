name: Android APK v2.2.30 PitchKind

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pilot rights scope
        run: |
          set -euo pipefail
          python verification/verify_pilot_scope.py             --override app/src/main/assets/pilot_rights_override.json             --roster verification/pilot_active_roster.json             --emit-runtime-js app/src/main/assets/pilot-rights-runtime.js

      - name: Verify source contract
        run: |
          set -euo pipefail
          python verification/verify_v2_2_30_pitchkind_ui.py
          python verification/verify_club_logo_quality.py
          python -m pip install --quiet requests beautifulsoup4 pillow
          python -m unittest discover -s tests -p "test_*.py" -v
          node --check app/src/main/assets/cloud.js
          node --check app/src/main/assets/onboarding.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/static-feed-overlay.js
          node tests/test_fixture_ground_parser.js
          node tests/test_matchday_share.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK 35 ready."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent PitchKind signing key
        env:
          PITCHKIND_KEYSTORE_B64: ${{ secrets.PITCHKIND_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$PITCHKIND_KEYSTORE_B64"
          KEYSTORE="$RUNNER_TEMP/pitchkind-signing.p12"
          printf '%s' "$PITCHKIND_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "PITCHKIND_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          PITCHKIND_KEYSTORE_PASSWORD: ${{ secrets.PITCHKIND_KEYSTORE_PASSWORD }}
          PITCHKIND_KEY_ALIAS: ${{ secrets.PITCHKIND_KEY_ALIAS }}
          PITCHKIND_KEY_PASSWORD: ${{ secrets.PITCHKIND_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify permanent APK signer
        env:
          PITCHKIND_KEYSTORE_PASSWORD: ${{ secrets.PITCHKIND_KEYSTORE_PASSWORD }}
          PITCHKIND_KEY_ALIAS: ${{ secrets.PITCHKIND_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'

          EXPECTED="$(
            keytool -list -v               -keystore "$PITCHKIND_KEYSTORE_FILE"               -storetype PKCS12               -storepass "$PITCHKIND_KEYSTORE_PASSWORD"               -alias "$PITCHKIND_KEY_ALIAS" |
            awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}'
          )"

          ACTUAL="$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}'
          )"

          test -n "$EXPECTED"
          test -n "$ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

          echo "Permanent PitchKind signer verified: $ACTUAL"

      - name: APK content gate
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/pitchkind-wt_logo-primary.svg'
          unzip -l "$APK" | grep -q 'assets/pitchkind-wt_mark.svg'
          unzip -l "$APK" | grep -q 'assets/shooters-hill-logo.png'
          unzip -l "$APK" | grep -q 'assets/pilot_rights_override.json'
          unzip -l "$APK" | grep -q 'assets/pilot-rights-runtime.js'
          unzip -p "$APK" assets/pilot-rights-runtime.js | grep -Fq 'scope_verified'
          unzip -p "$APK" assets/shooters-hill-logo.png > "$RUNNER_TEMP/shooters-hill-logo.png"
          python verification/verify_club_logo_quality.py --asset "$RUNNER_TEMP/shooters-hill-logo.png"
          test "$(sha256sum "$RUNNER_TEMP/shooters-hill-logo.png" | awk '{print $1}')" = "ea3b232a45b197da47d76ffc4bc38440eef9a096a9510af5a988aabc3df71bce"
          unzip -p "$APK" assets/index.html | grep -q '<title>PitchKind</title>'
          unzip -p "$APK" assets/index.html | grep -q 'App version 2.2.30'
          unzip -p "$APK" assets/app.js > "$RUNNER_TEMP/pitchkind-apk-app.js"
          unzip -p "$APK" assets/cloud.js > "$RUNNER_TEMP/pitchkind-apk-cloud.js"
          unzip -p "$APK" assets/styles.css > "$RUNNER_TEMP/pitchkind-apk-styles.css"
          unzip -p "$APK" assets/app-design-system.css > "$RUNNER_TEMP/pitchkind-apk-design-system.css"
          grep -Fq "function sanitizeMiniSoccerParentStateClient(input,age,profileRole=context?.profile?.role||'')" "$RUNNER_TEMP/pitchkind-apk-cloud.js"
          grep -Fq "if(mode==='parentsignup')" "$RUNNER_TEMP/pitchkind-apk-cloud.js"
          grep -Fq "request_parent_access" "$RUNNER_TEMP/pitchkind-apk-cloud.js"
          grep -Fq "function resumeParentSignupRequestFromMetadata()" "$RUNNER_TEMP/pitchkind-apk-cloud.js"
          grep -Fq "I’ve Verified My Email" "$RUNNER_TEMP/pitchkind-apk-cloud.js"
          grep -Fq "Sign in to finish sending your parent access request." "$RUNNER_TEMP/pitchkind-apk-cloud.js"
          grep -Fq "list_pending_parent_requests" "$RUNNER_TEMP/pitchkind-apk-cloud.js"
          grep -Fq "Parent Sign Up" "$RUNNER_TEMP/pitchkind-apk-cloud.js"
          unzip -p "$APK" assets/index.html | grep -q 'Parents do not need an invite code'
          grep -Fq "function openNewMatchForCompetition(competition,status='scheduled')" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "async function undoMatchPlayed()" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function renderMatchOverview(m)" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function renderFixtureOverview(prefix,f)" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function mapsEmbedHref(...parts)" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function isProviderOwnedMatch(m={})" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function furtherFixtureCardHtml(f,index)" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function kitProfileForTeam(teamName='',fallbackHome='')" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function openClubDetails(teamName='')" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function fixtureKitChoice(f={})" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function shirtColoursOnly(text='')" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function programmeParentView()" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function setSquadPage(page)" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "const tacticsOn=featureEnabled('tactics')" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function themePreference(){return localStorage.getItem(THEME_KEY)||'dark';}" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function openNextFixtureDetails()" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function saveFixtureConfirmation()" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function shareNextMatchImage()" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function clubPlaceholderBadgeHtml" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function matchTeamSideHtml" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function parseSelkentClubGroundOptions" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function matchdayArrivalTime" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "function matchdayShareCaption" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "https://www.google.com/maps/search/?api=1&query=" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "shareMatchCard(dataUrl,caption)" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "ClubHubNative?.assetDataUrl" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "ctx.arc(x,y,94,0,Math.PI*2);ctx.clip()" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "matchday share failed" "$RUNNER_TEMP/pitchkind-apk-app.js"
          unzip -p "$APK" assets/index.html | grep -Fq "Confirm fixture details"
          unzip -p "$APK" assets/index.html | grep -Fq 'id="next-match-share">Share matchday info'
          unzip -p "$APK" assets/index.html | grep -Fq 'id="matches-next-share">Share matchday info'
          unzip -p "$APK" assets/index.html | grep -Fq 'id="next-fixture-scroll"'
          unzip -p "$APK" assets/index.html | grep -Fq 'id="next-fixture-action-bar"'
          unzip -p "$APK" assets/index.html | grep -Fq 'id="matches-next-details">Match details'
          grep -Fq "function reviewParentAccessNotification(notificationId)" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "data-review-parent-request" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq "Approve parent" "$RUNNER_TEMP/pitchkind-apk-app.js"
          grep -Fq 'v2.2.11 — full-screen Match played flow' "$RUNNER_TEMP/pitchkind-apk-styles.css"
          grep -Fq 'v2.2.18 — explicit squad pages, tactics-first layout and settings cleanup' "$RUNNER_TEMP/pitchkind-apk-styles.css"
          grep -Fq 'v2.2.24 — pending parent review alignment and approval UX' "$RUNNER_TEMP/pitchkind-apk-styles.css"
          grep -Fq 'v2.2.25 — compact dashboard next match and confirmed fixture details' "$RUNNER_TEMP/pitchkind-apk-styles.css"
          grep -Fq 'v2.2.26 — badge-first match identity, generic club placeholders and fixture actions' "$RUNNER_TEMP/pitchkind-apk-styles.css"
          grep -Fq 'v2.2.20 — verified club badge hero formatting' "$RUNNER_TEMP/pitchkind-apk-design-system.css"
          unzip -p "$APK" assets/index.html | grep -q 'id="squad-pages"'
          unzip -p "$APK" assets/index.html | grep -q 'Rules &amp; procedures'
          DEX_DIR="$RUNNER_TEMP/pitchkind-apk-dex"
          rm -rf "$DEX_DIR"
          mkdir -p "$DEX_DIR"
          unzip -qq "$APK" 'classes*.dex' -d "$DEX_DIR"
          grep -aR -Fq 'GrassrootsClubHub/2.2.30' "$DEX_DIR"
          grep -aR -Fq 'assetDataUrl' "$DEX_DIR"
          grep -aR -Fq 'Could not prepare matchday sharing' "$DEX_DIR"
          grep -aR -Fq 'PitchKind matchday info' "$DEX_DIR"
          grep -aR -Fq 'Share matchday info' "$DEX_DIR"
          ! unzip -p "$APK" assets/index.html | grep -q 'CONNECT • ORGANISE • GROW THE GAME'
          ! unzip -p "$APK" assets/index.html | grep -q 'More Than A Game'
          mkdir -p dist
          cp "$APK" dist/PitchKind-v2.2.30-debug.apk
          sha256sum dist/PitchKind-v2.2.30-debug.apk > dist/PitchKind-v2.2.30-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PitchKind-v2.2.30-debug
          path: |
            dist/PitchKind-v2.2.30-debug.apk
            dist/PitchKind-v2.2.30-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
