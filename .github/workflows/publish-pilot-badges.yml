name: Publish reviewed private-pilot badges

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: directory-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install directory dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Verify manifest, app delivery, and revocation
        run: |
          python -m unittest discover -s tests -p '*pilot_badge*.py' -v
          node tests/test_pilot_badge_data_delivery.js
          python scripts/publish_pilot_badges.py --check
      - name: Update badge metadata only
        run: python scripts/publish_pilot_badges.py --verify-assets
      - name: Commit feed change
        run: |
          git diff --check
          git config user.name "pitchkind-badge-bot"
          git config user.email "actions@github.com"
          git add data/directory.json
          git diff --cached --quiet || git commit -m "Publish reviewed private-pilot badge metadata"
          git push
