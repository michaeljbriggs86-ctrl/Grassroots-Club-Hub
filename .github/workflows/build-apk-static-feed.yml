name: Build Grassroots Club Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SOURCE_ZIPS < <(find . -maxdepth 1 -type f -iname '*Android*.zip' -print | sort)

          if [ "${#SOURCE_ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No Android source ZIP found in repository root."
            ls -la
            exit 1
          fi

          if [ "${#SOURCE_ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one Android source ZIP found. Keep only the current source archive."
            printf ' - %s\n' "${SOURCE_ZIPS[@]}"
            exit 1
          fi

          SOURCE_ZIP="${SOURCE_ZIPS[0]}"
          echo "Using Android source: $SOURCE_ZIP"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$SOURCE_ZIP" -d extracted

          SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS" || { echo "ERROR: settings.gradle not found"; exit 1; }

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Verify integrated v2.2.5 source and UI standard
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/grassrootsclubhub/universal/MainActivity.java"
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          CLOUD="$PROJECT_DIR/app/src/main/assets/cloud.js"
          OVERLAY="$PROJECT_DIR/app/src/main/assets/static-feed-overlay.js"
          DESIGN="$PROJECT_DIR/app/src/main/assets/app-design-system.css"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          GUIDELINE="$PROJECT_DIR/design_reference/APP-UI-DESIGN-GUIDELINES-SNAPSHOT-2026-09-19.md"

          for required in "$MAIN" "$INDEX" "$CLOUD" "$OVERLAY" "$DESIGN" "$GRADLE" "$GUIDELINE"; do
            test -f "$required" || { echo "ERROR: Missing expected source file: $required"; exit 1; }
          done

          grep -F 'GrassrootsClubHub/2.2.5' "$MAIN"
          grep -F 'versionCode 2205' "$GRADLE"
          grep -F "versionName '2.2.5'" "$GRADLE"
          grep -F 'approved-app-ui-2026-09-19-v1' "$CLOUD"
          grep -F 'approved-app-ui-2026-09-19-v1' "$DESIGN"
          grep -F 'app-design-system.css' "$INDEX"
          grep -F 'static-feed-overlay.js' "$INDEX"
          grep -F 'No deviations. No exceptions.' "$GUIDELINE"
          grep -F 'CSS circles/polygons combined to imitate a football' "$GUIDELINE"

          for image in \
            football-login-adult.jpg \
            football-login-player.jpg \
            football-login-club.jpg \
            football-pitch-hero.jpg \
            football-team-huddle.jpg
          do
            test -f "$PROJECT_DIR/app/src/main/assets/$image" || {
              echo "ERROR: Missing generated imagery $image"
              exit 1
            }
          done

          if find "$PROJECT_DIR/app/src/main/assets" -maxdepth 1 -name 'auth-scene-*.svg' | grep -q .; then
            echo "ERROR: Constructed auth football/goal SVG scenes must not return."
            exit 1
         
