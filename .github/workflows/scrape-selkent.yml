name: Scrape Selkent Results

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape-selkent.yml'
      - 'scripts/scrape.py'
      - 'tests/test_selkent_scrape.py'
      - 'tests/test_selkent_cup_results.py'
  pull_request:
    paths:
      - '.github/workflows/scrape-selkent.yml'
      - 'scripts/scrape.py'
      - 'tests/test_selkent_scrape.py'
      - 'tests/test_selkent_cup_results.py'
      - 'tests/fixtures/selkent_cupspage*'
  schedule:
    # Refresh public Selkent feed data every six hours so newly published
    # fixtures become available to the app promptly across all age groups.
    - cron: '0 */6 * * *'
    # Sunday match results change throughout the day. Offset these checks
    # from the private Worker's :00/:30 runs to spread provider traffic.
    # GitHub Actions cron times are UTC (08:10–19:40).
    - cron: '10,40 8-19 * * SUN'
  workflow_dispatch:

concurrency:
  group: scrape-selkent-public-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Check public scraper with captured and synthetic fixtures
        run: |
          python -m unittest discover -s tests -p 'test_selkent_scrape.py' -v
          python -m unittest discover -s tests -p 'test_selkent_results.py' -v
          python -m unittest discover -s tests -p 'test_selkent_cup_results.py' -v
  scrape:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Selkent parser tests
        run: |
          python -m unittest discover -s tests -p 'test_selkent_scrape.py' -v
          python -m unittest discover -s tests -p 'test_selkent_results.py' -v
          python -m unittest discover -s tests -p 'test_selkent_cup_results.py' -v

      - name: Run generalized Selkent scraper
        run: python scripts/scrape.py

      - name: Commit updated public feed
        run: |
          git config user.name "selkent-sync-bot"
          git config user.email "actions@github.com"
          git add data/results.json
          git diff --staged --quiet || git commit -m "Update Selkent public feed [automated]"
          # A separate app commit may land while the provider scrape runs.
          # Replay this one-file feed commit on the new main before pushing.
          git pull --rebase origin main
          git push
