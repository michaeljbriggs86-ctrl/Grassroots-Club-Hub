name: Verify supplied badge private readback

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/verify-supplied-badge-readback.yml'
      - 'scripts/publish_pilot_badges.py'
      - 'scripts/stage_pilot_badges_r2.py'
      - 'verification/pilot_verified_badges.json'

permissions:
  contents: read

jobs:
  readback:
    if: >-
      github.repository == 'michaeljbriggs86-ctrl/Grassroots-Club-Hub' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/supplied-badges-batch8'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install requests==2.32.5
      - name: Verify four immutable private objects without writing or publishing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          import requests
          sys.path.insert(0, 'scripts')
          from stage_pilot_badges_r2 import approvals, checked_stored_kind, r2_reader

          expected = {
              239: '7e64946b8128d26c98e1a3a6d46904e985900c2d6e42f4612c8d69914636d0b1',
              294: '57c759123b698259f11fcd9c9e691d44cfce4615cc44c44220e6972a09a21ed7',
              497: '368fb01a82172c619d968530fbeb659678cb3152f1779433b67b92882c21f2c4',
              303: 'd1a81b904aaacf9715e0e8d7005d6ebc5e1e0047469d2f68f58d4cc2bda76d77',
          }
          directory = json.loads(Path('data/directory.json').read_text())
          manifest = json.loads(Path('verification/pilot_verified_badges.json').read_text())
          approved = {int(b['club_id']): b for b in approvals(directory, manifest)}
          read = r2_reader(requests.get)
          failed = False
          for club_id, digest in expected.items():
              badge = approved[club_id]
              if badge['logo_sha256'] != digest or badge['logo_source'] != 'user_supplied_private':
                  raise ValueError(f'badge {club_id} changed since supplied-file review')
              key = f'{club_id}/{digest}'
              stored = read(key)
              if stored is None:
                  print(f'MISSING private object {key}')
                  failed = True
                  continue
              data, declared = stored
              kind = checked_stored_kind(badge, data)
              if kind != 'image/png' or declared != kind:
                  print(f'FAIL private MIME club_id={club_id}; declared={declared!r}; expected=image/png')
                  failed = True
                  continue
              print(f'PASS real private readback club_id={club_id} sha256={digest} bytes={len(data)} MIME={declared}')
          if failed:
              raise SystemExit('Private readback incomplete; do not merge or publish the badge manifest.')
          print('PASS all four immutable hashes and image MIME types; no cloud writes or deployment performed.')
          PY
