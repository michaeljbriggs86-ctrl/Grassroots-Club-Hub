name: Build Grassroots Club Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SOURCE_ZIPS < <(find . -maxdepth 1 -type f -iname '*Android*.zip' -print | sort)
          if [ "${#SOURCE_ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No Android source ZIP found in repository root."
            ls -la
            exit 1
          fi
          if [ "${#SOURCE_ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one Android source ZIP found. Keep only the current source archive."
            printf ' - %s\n' "${SOURCE_ZIPS[@]}"
            exit 1
          fi
          SOURCE_ZIP="${SOURCE_ZIPS[0]}"
          echo "Using Android source: $SOURCE_ZIP"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$SOURCE_ZIP" -d extracted
          SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS" || { echo "ERROR: settings.gradle not found"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Verify integrated v2.2.5 source and UI standard
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/grassrootsclubhub/universal/MainActivity.java"
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          CLOUD="$PROJECT_DIR/app/src/main/assets/cloud.js"
          OVERLAY="$PROJECT_DIR/app/src/main/assets/static-feed-overlay.js"
          DESIGN="$PROJECT_DIR/app/src/main/assets/app-design-system.css"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          GUIDELINE="$PROJECT_DIR/design_reference/APP-UI-DESIGN-GUIDELINES-SNAPSHOT-2026-09-19.md"

          for required in "$MAIN" "$INDEX" "$CLOUD" "$OVERLAY" "$DESIGN" "$GRADLE" "$GUIDELINE"; do
            test -f "$required" || { echo "ERROR: Missing expected source file: $required"; exit 1; }
          done

          grep -F 'GrassrootsClubHub/2.2.5' "$MAIN"
          grep -F 'versionCode 2205' "$GRADLE"
          grep -F "versionName '2.2.5'" "$GRADLE"
          grep -F 'approved-app-ui-2026-09-19-v1' "$CLOUD"
          grep -F 'approved-app-ui-2026-09-19-v1' "$DESIGN"
          grep -F 'app-design-system.css' "$INDEX"
          grep -F 'static-feed-overlay.js' "$INDEX"
          grep -F 'No deviations. No exceptions.' "$GUIDELINE"
          grep -F 'CSS circles/polygons combined to imitate a football' "$GUIDELINE"

          for image in football-login-adult.jpg football-login-player.jpg football-login-club.jpg football-pitch-hero.jpg football-team-huddle.jpg; do
            test -f "$PROJECT_DIR/app/src/main/assets/$image" || { echo "ERROR: Missing generated imagery $image"; exit 1; }
          done
          if find "$PROJECT_DIR/app/src/main/assets" -maxdepth 1 -name 'auth-scene-*.svg' | grep -q .; then
            echo "ERROR: Constructed auth football/goal SVG scenes must not return."
            exit 1
          fi

          node --check "$CLOUD"
          node --check "$PROJECT_DIR/app/src/main/assets/onboarding.js"
          node --check "$PROJECT_DIR/app/src/main/assets/app.js"
          node --check "$OVERLAY"
          python "$PROJECT_DIR/verification/verify_v2_2_5_app_ui_standard.py"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK 35 ready."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Universal APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify built APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "ERROR: APK was not produced."; exit 1; }

          unzip -l "$APK" | grep -F 'assets/static-feed-overlay.js'
          unzip -l "$APK" | grep -F 'assets/app-design-system.css'
          unzip -l "$APK" | grep -F 'assets/football-login-adult.jpg'
          unzip -l "$APK" | grep -F 'assets/football-login-player.jpg'
          unzip -l "$APK" | grep -F 'assets/football-login-club.jpg'
          unzip -l "$APK" | grep -F 'assets/football-pitch-hero.jpg'
          unzip -p "$APK" assets/index.html | grep -F 'app-design-system.css'
          unzip -p "$APK" assets/cloud.js | grep -F 'approved-app-ui-2026-09-19-v1'
          unzip -p "$APK" assets/app-design-system.css | grep -F 'approved-app-ui-2026-09-19-v1'

          # Multidex-safe native marker verification: search every classes*.dex file.
          TMPDEX="$(mktemp -d)"
          unzip -q "$APK" 'classes*.dex' -d "$TMPDEX"
          if ! find "$TMPDEX" -type f -name 'classes*.dex' -print0 | xargs -0 strings | grep -Fq 'GrassrootsClubHub/2.2.5'; then
            echo "ERROR: v2.2.5 native marker not found in any classes*.dex"
            exit 1
          fi
          rm -rf "$TMPDEX"
          echo "Built APK contains the v2.2.5 app-wide UI standard and static feed integration."

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" Grassroots-Club-Hub-v2.2.5-app-wide-ui.apk
          sha256sum Grassroots-Club-Hub-v2.2.5-app-wide-ui.apk | tee Grassroots-Club-Hub-v2.2.5-app-wide-ui.apk.sha256
          ls -lh Grassroots-Club-Hub-v2.2.5-app-wide-ui.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grassroots-Club-Hub-APK-v2.2.5-App-Wide-UI
          path: |
            Grassroots-Club-Hub-v2.2.5-app-wide-ui.apk
            Grassroots-Club-Hub-v2.2.5-app-wide-ui.apk.sha256
          if-no-files-found: error
          retention-days: 30
