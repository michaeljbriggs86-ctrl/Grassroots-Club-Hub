name: Verify private Selkent shadow snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-selkent-shadow.yml'
      - 'cloudflare/selkent-shadow/verify-snapshot.mjs'
      - 'cloudflare/selkent-shadow/tests/verify-snapshot.test.mjs'
      - 'cloudflare/selkent-shadow/compare_snapshot.py'
      - 'cloudflare/selkent-shadow/tests/test_compare_snapshot.py'
  schedule:
    # Check the private collector after its :15 six-hour run (UTC).
    - cron: '45 */6 * * *'
    # On Sundays, check during match day after its :00/:30 runs.
    - cron: '50 8-19 * * SUN'

permissions:
  contents: read

concurrency:
  group: verify-selkent-shadow
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test private comparison parsers
        run: |
          python -m pip install requests beautifulsoup4
          python -m unittest discover -s cloudflare/selkent-shadow/tests -p 'test_compare_snapshot.py' -v
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
      - name: Test snapshot verifier
        run: node --test cloudflare/selkent-shadow/tests/verify-snapshot.test.mjs
      - name: Read private remote snapshot
        working-directory: cloudflare/selkent-shadow
        run: |
          npx --yes wrangler@4.142.0 r2 object get \
            pitchkind-selkent-shadow/shadow/latest.json \
            --remote --file "$RUNNER_TEMP/selkent-shadow-latest.json"
      - name: Check freshness, completeness and public feed targets
        run: |
          node cloudflare/selkent-shadow/verify-snapshot.mjs \
            "$RUNNER_TEMP/selkent-shadow-latest.json" data/results.json
      - name: Compare normalized private and public data
        run: |
          python cloudflare/selkent-shadow/compare_snapshot.py \
            "$RUNNER_TEMP/selkent-shadow-latest.json" data/results.json
