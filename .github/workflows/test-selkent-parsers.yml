name: Test Selkent Parsers

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-selkent-parsers.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-selkent-parsers.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4 Pillow==12.3.0 numpy==2.3.5 scipy==1.17.0

      - name: Run Selkent parser tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
