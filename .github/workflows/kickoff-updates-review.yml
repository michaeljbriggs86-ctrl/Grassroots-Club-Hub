name: Kick-off updates review
on:
  pull_request:
    paths:
      - 'app/src/main/assets/**'
      - 'cloudflare/web-app/**'
      - 'supabase/migrations/*kickoff_updates.sql'
      - 'supabase/migrations/*kickoff_updates_singleton_guard.sql'
      - 'supabase/functions/kickoff-dispatch/**'
      - 'tests/kickoff*.mjs'
      - 'web/db-drafts/test/run-kickoff-updates.cjs'
      - 'web/db-drafts/2026-10-15_kickoff_response_actions.sql'
      - 'web/db-drafts/test/run-kickoff-response-actions.cjs'
      - 'web/db-drafts/test/kickoff-response-actions-extra.cjs'
      - 'verification/browser/verify_kickoff_updates.cjs'
      - 'verification/browser/check_kickoff_response_actions.cjs'
      - 'verification/browser/check_kickoff_dispatcher.cjs'
      - 'supabase/migrations/*kickoff_dispatch_schedule.sql'
      - '.github/workflows/kickoff-updates-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kickoff-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check committed updates, receipt permissions and transport logic
        run: |
          npm install --prefix "$RUNNER_TEMP/kickoff-test" --no-audit --no-fund @electric-sql/pglite@0.3.14 web-push@3.6.7 deno@2.9.6
          node --check app/src/main/assets/kickoff-updates.js
          node web/db-drafts/test/run-kickoff-updates.cjs "$RUNNER_TEMP/kickoff-test/node_modules/@electric-sql/pglite"
          node web/db-drafts/test/run-kickoff-response-actions.cjs "$RUNNER_TEMP/kickoff-test/node_modules/@electric-sql/pglite"
          KICKOFF_NODE_MODULES="$RUNNER_TEMP/kickoff-test/node_modules" node --test tests/kickoff_delivery.test.mjs tests/kickoff_save_commit.test.mjs
          ln -s "$RUNNER_TEMP/kickoff-test/node_modules" node_modules
          "$RUNNER_TEMP/kickoff-test/node_modules/.bin/deno" check --no-lock --node-modules-dir=manual supabase/functions/kickoff-dispatch/index.ts
          KICKOFF_NODE_MODULES="$RUNNER_TEMP/kickoff-test/node_modules" node verification/browser/check_kickoff_dispatcher.cjs "$RUNNER_TEMP/kickoff-test/node_modules/.bin/deno"
          git diff --check
      - name: Inspect built receipt and device push UI with fictional accounts
        run: |
          python cloudflare/web-app/build.py
          npm install --prefix "$RUNNER_TEMP/kickoff-browser" --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/kickoff-browser/node_modules/.bin/playwright" install --with-deps chromium
          node verification/browser/verify_kickoff_updates.cjs "$RUNNER_TEMP/kickoff-browser/node_modules/playwright" "$RUNNER_TEMP/kickoff-review"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kickoff-review-${{ github.run_id }}
          path: ${{ runner.temp }}/kickoff-review
          if-no-files-found: ignore
          retention-days: 7
