name: Scrape Selkent Results

on:
  schedule:
    # Results change after matches are played (weekends) - poll often then.
    - cron: '0 * * * 6,0'   # every hour on Sat & Sun
    - cron: '0 18 * * 1-5'  # once at 18:00 UTC on weekdays

    # Fixtures are released irregularly (single/small batches, ~1 week's
    # notice, no fixed release day) - a daily check is enough to catch a
    # release within 24 hours without wasting Action minutes on weekends
    # when nothing about fixture release timing is weekend-specific.
    - cron: '0 7 * * *'    # once daily at 07:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "selkent-sync-bot"
          git config user.email "actions@github.com"
          git add data/results.json
          git diff --staged --quiet || git commit -m "Update Selkent results [automated]"
          git push
