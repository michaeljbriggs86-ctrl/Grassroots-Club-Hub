name: Store reviewed pilot badges privately in R2

on:
  workflow_dispatch:
  # A scrape's GITHUB_TOKEN commit cannot trigger another push workflow.
  # Completion starts this same guarded publisher without consuming artifacts.
  workflow_run:
    workflows:
      - Scrape Selkent Results
      - Scrape Selkent Club/League Directory
      - Publish reviewed private-pilot badges
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-pilot-badges-r2.yml'
      - 'scripts/verify_web_deploy_snapshot.py'
      - 'tests/test_web_deploy_snapshot.py'
      - 'data/results.json'
      - 'data/directory.json'
      - 'verification/pilot_verified_badges.json'
      - 'verification/approved_badges/**'
      - 'tests/test_publish_pilot_badges.py'
      - 'tests/test_stage_pilot_badges_r2.py'
      - 'tests/test_pilot_badge_data_delivery.js'
      - 'scripts/stage_pilot_badges_r2.py'
      - 'scripts/publish_pilot_badges.py'
      - 'scripts/pilot_badge_transparency.py'
      - 'cloudflare/web-app/src/pilot-badges.js'
      - 'cloudflare/web-app/src/badge-review.js'
      - 'cloudflare/web-app/src/index.js'
      - 'cloudflare/web-app/src/selkent-feed.js'
      - 'cloudflare/web-app/tests/selkent-feed.test.mjs'
      - 'cloudflare/web-app/wrangler.jsonc'
      - 'cloudflare/web-app/service-worker.js'
      - 'cloudflare/web-app/build.py'
      - 'cloudflare/web-app/_headers'
      - 'app/src/main/assets/**'

permissions:
  contents: write

concurrency:
  group: stage-pilot-badges-r2
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scrape's head_sha precedes its feed commit. Build current main,
          # never the triggering branch, an upstream artifact, or a stale SHA.
          ref: main
          fetch-depth: 0
      - name: Validate trusted deployment event
        run: python scripts/verify_web_deploy_snapshot.py --event-only
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test approval and protected route
        run: |
          python -m pip install requests beautifulsoup4 Pillow==12.3.0 numpy==2.3.5 scipy==1.17.0 PyYAML==6.0.3
          python -m unittest discover -s tests -p 'test_web_deploy_snapshot.py' -v
          python -m unittest discover -s tests -p '*pilot_badge*.py' -v
          node --test cloudflare/web-app/tests/pilot-badges.test.mjs
          node --test cloudflare/web-app/tests/badge-review.test.mjs
          node --test cloudflare/web-app/tests/selkent-candidate.test.mjs
          node --test cloudflare/web-app/tests/selkent-feed.test.mjs
          node tests/test_pilot_badge_data_delivery.js
          python scripts/stage_pilot_badges_r2.py --check
          python3 cloudflare/web-app/build.py
          cd cloudflare/web-app && npx --yes wrangler@4.142.0 deploy --dry-run
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Create private bucket if needed
        run: |
          if ! npx --yes wrangler@4.142.0 r2 bucket info pitchkind-pilot-badges; then
            npx --yes wrangler@4.142.0 r2 bucket create pitchkind-pilot-badges
          fi
      - name: Verify approved R2 bytes and image types, repairing generic metadata
        run: python scripts/stage_pilot_badges_r2.py --upload --prefer-stored
      - name: Publish metadata after verified R2 readback
        run: |
          # The preceding gate verified every immutable approved R2 object.
          python scripts/publish_pilot_badges.py
          python cloudflare/web-app/build.py
          git diff --check
      - name: Deploy protected website Worker with R2 binding
        id: deploy
        working-directory: cloudflare/web-app
        run: |
          # Refuse stale main or a bundle that differs from the checked feeds.
          python ../../scripts/verify_web_deploy_snapshot.py --receipt "$RUNNER_TEMP/web-deploy-snapshot.json"
          npx --yes wrangler@4.142.0 deploy
      - name: Preserve deployment snapshot evidence
        if: success() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: web-deploy-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-deploy-snapshot.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified badge metadata
        run: |
          git config user.name "pitchkind-badge-bot"
          git config user.email "actions@github.com"
          git add data/directory.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified private-pilot badge metadata"
            git push origin HEAD:main || {
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            }
          fi
